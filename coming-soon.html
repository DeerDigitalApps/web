<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="This DeerDigital page is currently under construction."
    >

    <meta name="theme-color" content="#080411">

    <title>Coming Soon | DeerDigital</title>

    <link
        rel="stylesheet"
        href="css/coming-soon.css"
    >
</head>

<body>

    <canvas
        id="stars"
        aria-hidden="true"
    ></canvas>

    <div
        class="background-effects"
        aria-hidden="true"
    >
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>

        <div class="background-grid"></div>
    </div>

    <main class="coming-soon-page">

        <a
            href="index.html"
            class="brand"
            aria-label="Return to DeerDigital"
        >
            <span class="brand-symbol">
                D
            </span>

            <span class="brand-name">
                DeerDigital
            </span>
        </a>

        <section class="coming-soon-content">

            <div class="floating-wrapper">

                <div
                    class="orbit orbit-one"
                    aria-hidden="true"
                ></div>

                <div
                    class="orbit orbit-two"
                    aria-hidden="true"
                ></div>

                <div class="status-badge">
                    <span class="status-dot"></span>
                    Work in progress
                </div>

                <h1>
                    Coming
                    <span>soon.</span>
                </h1>

                <p class="construction-label">
                    Site under construction
                </p>

                <p class="description">
                    This part of DeerDigital is still being built.
                    Something new is taking shape behind the scenes.
                </p>

                <a
                    href="index.html"
                    class="home-button"
                >
                    <span>Return to DeerDigital</span>
                    <strong aria-hidden="true">→</strong>
                </a>

            </div>

        </section>

        <footer class="page-footer">

            <span>
                © <span id="year"></span> DeerDigital
            </span>

            <span class="footer-divider"></span>

            <span>
                Creating apps and games
            </span>

        </footer>

    </main>

    <script src="js/coming-soon.js"></script>

</body>

</html>
